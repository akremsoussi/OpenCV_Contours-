name: Build

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y g++ make pkg-config libopencv-dev
      - name: Build
        run: make
      - name: Verify usage message
        shell: bash
        run: |
          set +e
          output=$(./contours 2>&1)
          status=$?
          set -e
          test "$status" -eq 1
          printf '%s\n' "$output" | grep -q 'Usage :'
